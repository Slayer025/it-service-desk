<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Service Desk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .login-box { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; color: #1e3c72; margin-bottom: 0.5rem; font-size: 1.6rem; }
        .login-box p.subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,0.1); }
        
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.5rem; }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(42,82,152,0.4); }
        
        .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center; }
        .alert-error { background: #fee; color: #c0392b; border: 1px solid #fcc; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        
        .test-creds { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee; text-align: center; font-size: 0.8rem; color: #999; }
        .test-creds code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: #2a5298; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2> IT Service Desk</h2>
        <p class="subtitle">Sign in to manage tickets</p>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit">Sign In</button>
        </form>
        
        <div class="test-creds">
            Test Accounts (all use password: <code>password123</code>)<br>
            <code>admin</code> · <code>agent</code> · <code>enduser</code>
        </div>
    </div>
</body>
</html>
