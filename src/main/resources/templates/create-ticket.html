<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket - IT Service Desk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        nav { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 1rem 2rem; }
        nav a { color: white; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { opacity: 0.8; }
        
        .container { max-width: 650px; margin: 2rem auto; padding: 0 1.5rem; }
        .form-card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-card h2 { color: #1e3c72; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .form-card p { color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; 
            font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; 
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
            outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,0.1); 
        }
        .form-group textarea { height: 120px; resize: vertical; }
        
        .alert-error { background: #fee; color: #c0392b; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid #fcc; }
        
        button { padding: 14px 32px; background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(42,82,152,0.4); }
        
        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
            .form-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <nav><a th:href="@{/dashboard}">← Back to Dashboard</a></nav>
    <div class="container">
        <div class="form-card">
            <h2>Create New Ticket</h2>
            <p>Fill in the details below to submit a new support request.</p>
            
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>
            
            <form th:action="@{/create-ticket}" method="post" th:object="${ticket}">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" name="title" required placeholder="Brief description of the issue" maxlength="200">
                </div>
                
                <div class="form-group">
                    <label>Description *</label>
                    <textarea name="description" required placeholder="Provide detailed information about the issue..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Priority *</label>
                    <select name="priority" required>
                        <option value="">-- Select Priority --</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Category *</label>
                    <select name="categoryId" required>
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.id}" 
                                th:text="${cat.name}"></option>
                    </select>
                </div>
                
                <button type="submit">Create Ticket</button>
            </form>
        </div>
    </div>
</body>
</html>
