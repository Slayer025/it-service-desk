spring.application.name=it-service-desk
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/it_service_desk
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Disabled open-in-view for performance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.itservicedesk=INFO
logging.pattern.console=%green(%d{HH:mm:ss}) %blue(%-5level) %cyan([%thread]) %yellow(%logger{20}) - %msg%n